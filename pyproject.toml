[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntopic-reading"
version = "0.1.0"
description = "Syntopic reading system: extracts topics across a book library and generates cross-book reading trails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mike Herak" },
]

dependencies = [
    "selectolax>=0.3.17",
    "sqlite-vec>=0.1.1",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.2",
    "numpy>=1.24.3",
    "igraph>=0.11.3",
    "leidenalg>=0.10.2",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
]
# Deferred v2 UI (dashboard/) — not required to run the v1 pipeline.
dashboard = [
    "streamlit>=1.30.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
